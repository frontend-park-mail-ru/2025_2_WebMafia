name: Frontend CI


on: 
    push:
        branches: ['dev', 'main']
    pull_request:
        branches: ['dev', 'main']

jobs:
    check-and-build:
        runs-on: ubuntu-latest
    
        steps:
          - name: Checkout code
            uses: actions/checkout@v4

          - name: Setup Node.js
            uses: actions/setup-node@v4
            with:
                node-version: '20'
                chache: npm

          - name: Install dependencies
            run: npm ci

          - name: Run ESLint
            run: npm run lint

          - name: Run Stylelint
            run: npm run lint:css

          - name: Check Formatting (Prettier)
            run: npx prettier --check "**/*.{js,hbs,css,json,md}"

          - name: Build Project
            run: npm run build:server


        
